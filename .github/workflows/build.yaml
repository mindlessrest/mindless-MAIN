name: Build and Publish Client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"

concurrency:
  group: production-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production client
        run: ./build.sh --prod

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            MindlessLoader.exe \
            client/native_build/dist/MindlessNative.dll \
            client/build/libs/mindless.jar \
            client/build/intermediates/mindless-lunar-mcp-with-forge.jar; do
            test -s "$file" || {
              echo "::error::Missing or empty build output: $file"
              exit 1
            }
          done

      # A jar can be present and still unusable: the native loader defines its class loader from
      # these classes out of the embedded payload, and a payload without them fails every
      # injection with bootstrap error 7. Check the jars that get embedded, not only that they
      # exist, and never publish one that would not start.
      - name: Verify payload contents
        shell: bash
        run: |
          set -euo pipefail

          list_entries() {
            if command -v unzip >/dev/null 2>&1; then
              unzip -Z1 "$1"
            else
              python3 - "$1" <<'PY'
          import sys, zipfile
          for name in zipfile.ZipFile(sys.argv[1]).namelist():
              print(name)
          PY
            fi
          }

          echo "compiled main classes: $(find client/build/classes/java/main -name '*.class' 2>/dev/null | wc -l)"
          missing=0
          for jar in client/build/libs/mindless.jar client/build/intermediates/mindless-lunar-mcp-with-forge.jar; do
            list_entries "$jar" > entries.txt
            echo "$jar: $(grep -vc '/$' entries.txt) files, $(grep -c '^mindless/' entries.txt || true) under mindless/"
            for cls in \
              mindless/runtime/MemoryResourceStore.class \
              mindless/runtime/MemoryURLConnection.class \
              mindless/runtime/MemoryURLStreamHandler.class \
              mindless/runtime/NativeBootstrap.class \
              mindless/runtime/MindlessTransformerManager.class; do
              if ! grep -qxF "$cls" entries.txt; then
                echo "::error::$jar is missing $cls"
                missing=1
              fi
            done
          done
          rm -f entries.txt
          test "$missing" -eq 0

      - name: Verify deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST" || {
            echo "::error::DEPLOY_HOST is not configured"
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "::error::DEPLOY_USER is not configured"
            exit 1
          }

          test -n "$DEPLOY_SSH_KEY" || {
            echo "::error::DEPLOY_SSH_KEY is not configured"
            exit 1
          }

      - name: Upload release to VPS staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "MindlessLoader.exe,client/native_build/dist/MindlessNative.dll"
          target: "/tmp/mindless-${{ github.sha }}"

      - name: Publish release to panel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu

            staging="/tmp/mindless-${{ github.sha }}"

            loader="$staging/MindlessLoader.exe"
            native="$staging/client/native_build/dist/MindlessNative.dll"
            test -s "$loader"
            test -s "$native"

            cd /var/mindless/backend

            git fetch origin main
            git reset --hard origin/main

            go run ./cmd/promote-release \
              -config config.yaml \
              -loader "$loader" \
              -native "$native"

            rm -rf "$staging"
