name: Build and Publish Client

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: production-client
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle distribution, the dependency cache and the local
      # build cache, keyed from the wrapper and build scripts. Replaces
      # setup-java's `cache: gradle`, which only cached ~/.gradle/caches and
      # missed on every run here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve vcpkg revision
        id: vcpkg
        shell: pwsh
        run: |
          $rev = (git -C C:\vcpkg rev-parse HEAD).Trim()
          if (-not $rev) { throw "could not resolve the vcpkg revision at C:\vcpkg" }
          "rev=$rev" >> $env:GITHUB_OUTPUT
          "archives=$env:LOCALAPPDATA\vcpkg\archives" >> $env:GITHUB_OUTPUT

      # vcpkg's own binary cache. Each package is stored under its ABI hash,
      # which covers the compiler, triplet, port version, features and
      # dependency graph — a mismatch misses and rebuilds rather than reusing
      # an incompatible binary. The key pins the vcpkg revision and the
      # manifest so a toolchain or dependency bump starts a fresh entry, and
      # the restore-keys let an unrelated dependency change still reuse the
      # packages that did not move (openssl alone is ~10 minutes to build).
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.archives }}
          key: vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('loader/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.vcpkg.outputs.rev }}-
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-

      - name: Build production client
        shell: pwsh
        run: python tools/build.py --prod --no-cache

      - name: Verify release files
        shell: pwsh
        run: |
          $files = @(
            "MindlessLoader.exe",
            "client/native_build/dist/MindlessNative.dll"
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release file: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty release file: $file"
            }
          }
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item -LiteralPath "MindlessLoader.exe" -Destination "release/MindlessLoader.exe"
          Copy-Item -LiteralPath "client/native_build/dist/MindlessNative.dll" -Destination "release/MindlessNative.dll"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindless-client-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY is not configured"; exit 1; }

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: mindless-client-${{ github.sha }}
          path: release

      - name: Upload release to VPS staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "release/MindlessLoader.exe,release/MindlessNative.dll"
          target: "/tmp/mindless-${{ github.sha }}"
          strip_components: 1

      - name: Publish release to panel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            staging="/tmp/mindless-${{ github.sha }}"
            test -s "$staging/MindlessLoader.exe"
            test -s "$staging/MindlessNative.dll"
            cd /var/mindless/backend
            go run ./cmd/promote-release \
              -config config.yaml \
              -loader "$staging/MindlessLoader.exe" \
              -native "$staging/MindlessNative.dll"
            rm -f "$staging/MindlessLoader.exe" "$staging/MindlessNative.dll"
            rmdir "$staging"
