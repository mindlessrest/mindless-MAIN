name: Build and Publish Client

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: production-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      forge-jar-sha256: ${{ steps.release-metadata.outputs.forge-jar-sha256 }}
      lunar-jar-sha256: ${{ steps.release-metadata.outputs.lunar-jar-sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Voyager revision
        id: voyager
        shell: pwsh
        env:
          VOYAGER_TOKEN: ${{ secrets.VOYAGER_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOYAGER_TOKEN)) {
            throw "VOYAGER_TOKEN is not configured"
          }

          $headers = @{
            Authorization = "Bearer $env:VOYAGER_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $commit = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/mindlessrest/ci/commits/main" `
            -Headers $headers

          $revision = $commit.sha

          if ($revision -notmatch "^[0-9a-f]{40}$") {
            throw "Invalid mindlessrest/ci revision: $revision"
          }

          "revision=$revision" >> $env:GITHUB_OUTPUT
          Write-Host "Voyager revision: $revision"

      - name: Cache extracted Voyager compiler
        id: voyager-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/voyager
          key: voyager-v1-${{ runner.os }}-${{ steps.voyager.outputs.revision }}

      - name: Download and extract Voyager compiler
        if: steps.voyager-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VOYAGER_REVISION: ${{ steps.voyager.outputs.revision }}
          VOYAGER_TOKEN: ${{ secrets.VOYAGER_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOYAGER_TOKEN)) {
            throw "VOYAGER_TOKEN is not configured"
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager-source\Voyager.7z"
          $destination = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager"

          $archiveDirectory = Split-Path -Parent $archive

          New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $headers = @{
            Authorization = "Bearer $env:VOYAGER_TOKEN"
            Accept = "application/vnd.github.raw+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $url = "https://api.github.com/repos/mindlessrest/ci/contents/Voyager.7z?ref=$env:VOYAGER_REVISION"

          Invoke-WebRequest `
            -Uri $url `
            -Headers $headers `
            -OutFile $archive

          if (
            !(Test-Path -LiteralPath $archive -PathType Leaf) -or
            (Get-Item -LiteralPath $archive).Length -eq 0
          ) {
            throw "Voyager archive download failed"
          }

          & 7z x $archive "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract Voyager.7z (exit $LASTEXITCODE)"
          }

      - name: Resolve and validate Voyager compiler
        shell: pwsh
        run: |
          $searchRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager"

          $clang = Get-ChildItem `
            -LiteralPath $searchRoot `
            -Filter clang.exe `
            -File `
            -Recurse |
            Where-Object { $_.Directory.Name -eq "bin" } |
            Select-Object -First 1

          if (!$clang) {
            throw "Could not find bin\clang.exe below $searchRoot"
          }

          $root = $clang.Directory.Parent.FullName

          $cxx = @("clang-cl.exe", "clang++.exe") |
            ForEach-Object { Join-Path $root "bin\$_" } |
            Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            } |
            Select-Object -First 1

          $resourceDir = Join-Path $root "lib\clang\20"

          if (!$cxx) {
            throw "Missing bin\clang-cl.exe or bin\clang++.exe in $root"
          }

          if (!(Test-Path -LiteralPath $resourceDir -PathType Container)) {
            throw "Missing Clang 20 resource directory: $resourceDir"
          }

          "VOYAGER_PATH=$root" >> $env:GITHUB_ENV

          Write-Host "Resolved Voyager root: $root"
          Write-Host "Resolved C compiler: $($clang.FullName)"
          Write-Host "Resolved C++ compiler: $cxx"

          & $clang.FullName --version

          if ($LASTEXITCODE -ne 0) {
            throw "clang --version failed"
          }

          & $clang.FullName -print-resource-dir

          if ($LASTEXITCODE -ne 0) {
            throw "clang -print-resource-dir failed"
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve vcpkg revision
        id: vcpkg
        shell: pwsh
        run: |
          $rev = (git -C C:\vcpkg rev-parse HEAD).Trim()

          if (-not $rev) {
            throw "Could not resolve the vcpkg revision at C:\vcpkg"
          }

          "rev=$rev" >> $env:GITHUB_OUTPUT
          "archives=$env:LOCALAPPDATA\vcpkg\archives" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.archives }}
          key: vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('loader/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.vcpkg.outputs.rev }}-
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            client/native_build
            loader/out/build
            loader/CMakePresets.json
            loader/vcpkg_installed
          key: native-v2-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.voyager.outputs.revision }}-${{ steps.vcpkg.outputs.rev }}-${{ github.sha }}
          restore-keys: |
            native-v2-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.voyager.outputs.revision }}-${{ steps.vcpkg.outputs.rev }}-
            native-v2-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.voyager.outputs.revision }}-

      - name: Restore obfuscator cache
        id: obfuscator-cache
        uses: actions/cache@v4
        with:
          path: tools/obf/build/libs/mindless-obf.jar
          key: obfuscator-v2-${{ runner.os }}-${{ hashFiles('tools/obf/src/**', 'tools/obf/*.gradle.kts') }}

      - name: Build production client
        shell: pwsh
        run: |
          $message = git log -1 --pretty=%B
          if ($message -match '\[debug\]') {
            $env:MINDLESS_DEBUG_LOGS = "1"
            Write-Host "[debug] detected; native DbgView logging remains enabled."
          }
          if ('${{ steps.obfuscator-cache.outputs.cache-hit }}' -eq 'true') {
            $env:MINDLESS_OBF_CACHE_HIT = "1"
          }
          python tools/build.py --prod --no-cache

      - name: Verify release files
        id: release-metadata
        shell: pwsh
        run: |
          $files = @(
            "MindlessLoader.exe",
            "client/native_build/dist/MindlessNative.dll",
            "client/build/libs/mindless-obf.jar",
            "client/build/intermediates/mindless-lunar-mcp-with-forge-obf.jar",
            "client/build/mappings/forge.json",
            "client/build/mappings/lunar.json"
          )

          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release file: $file"
            }

            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty release file: $file"
            }
          }

          $forgeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "client/build/libs/mindless-obf.jar").Hash.ToLowerInvariant()
          $lunarHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "client/build/intermediates/mindless-lunar-mcp-with-forge-obf.jar").Hash.ToLowerInvariant()
          "forge-jar-sha256=$forgeHash" >> $env:GITHUB_OUTPUT
          "lunar-jar-sha256=$lunarHash" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Path release -Force | Out-Null

          Copy-Item `
            -LiteralPath "MindlessLoader.exe" `
            -Destination "release/MindlessLoader.exe"

          Copy-Item `
            -LiteralPath "client/native_build/dist/MindlessNative.dll" `
            -Destination "release/MindlessNative.dll"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindless-client-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload private crash mappings
        uses: actions/upload-artifact@v4
        with:
          name: mindless-mappings-${{ github.sha }}
          path: client/build/mappings/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || {
            echo "::error::DEPLOY_HOST is not configured"
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "::error::DEPLOY_USER is not configured"
            exit 1
          }

          test -n "$DEPLOY_SSH_KEY" || {
            echo "::error::DEPLOY_SSH_KEY is not configured"
            exit 1
          }

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: mindless-client-${{ github.sha }}
          path: release

      - name: Download private crash mappings
        uses: actions/download-artifact@v4
        with:
          name: mindless-mappings-${{ github.sha }}
          path: mappings

      - name: Upload release to VPS staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "release/MindlessLoader.exe,release/MindlessNative.dll,mappings/forge.json,mappings/lunar.json"
          target: "/tmp/mindless-${{ github.sha }}"
          strip_components: 1

      - name: Publish release to panel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu

            staging="/tmp/mindless-${{ github.sha }}"

            test -s "$staging/MindlessLoader.exe"
            test -s "$staging/MindlessNative.dll"
            test -s "$staging/forge.json"
            test -s "$staging/lunar.json"

            cd /var/mindless/backend

            git fetch origin main
            git reset --hard origin/main

            go run ./cmd/promote-release \
              -config config.yaml \
              -loader "$staging/MindlessLoader.exe" \
              -native "$staging/MindlessNative.dll" \
              -build-id "${{ github.sha }}" \
              -forge-mapping "$staging/forge.json" \
              -lunar-mapping "$staging/lunar.json" \
              -forge-jar-sha256 "${{ needs.build.outputs.forge-jar-sha256 }}" \
              -lunar-jar-sha256 "${{ needs.build.outputs.lunar-jar-sha256 }}"

            rm -f \
              "$staging/MindlessLoader.exe" \
              "$staging/MindlessNative.dll" \
              "$staging/forge.json" \
              "$staging/lunar.json"

            rmdir "$staging"
