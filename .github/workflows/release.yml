name: Build and Publish Client

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: production-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Voyager revision
        id: voyager
        shell: pwsh
        env:
          VOYAGER_TOKEN: ${{ secrets.VOYAGER_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOYAGER_TOKEN)) {
            throw "VOYAGER_TOKEN is not configured"
          }

          $headers = @{
            Authorization = "Bearer $env:VOYAGER_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $commit = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/mindlessrest/ci/commits/main" `
            -Headers $headers

          $revision = $commit.sha
          if ($revision -notmatch "^[0-9a-f]{40}$") {
            throw "Invalid mindlessrest/ci revision: $revision"
          }

          "revision=$revision" >> $env:GITHUB_OUTPUT
          "Voyager revision: $revision"

      - name: Cache extracted Voyager compiler
        id: voyager-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/voyager
            .ci/mindless-protector
          key: voyager-protector-v1-${{ runner.os }}-${{ steps.voyager.outputs.revision }}

      - name: Download and extract Voyager compiler
        if: steps.voyager-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VOYAGER_REVISION: ${{ steps.voyager.outputs.revision }}
          VOYAGER_TOKEN: ${{ secrets.VOYAGER_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOYAGER_TOKEN)) {
            throw "VOYAGER_TOKEN is not configured"
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager-source\Voyager.7z"
          $destination = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager"
          $protectorArchive = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager-source\Ryujin.zip"
          $protectorDestination = Join-Path $env:GITHUB_WORKSPACE ".ci\mindless-protector"
          $archiveDirectory = Split-Path -Parent $archive

          New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          New-Item -ItemType Directory -Path $protectorDestination -Force | Out-Null

          $headers = @{
            Authorization = "Bearer $env:VOYAGER_TOKEN"
            Accept = "application/vnd.github.raw+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $url = "https://api.github.com/repos/mindlessrest/ci/contents/Voyager.7z?ref=$env:VOYAGER_REVISION"

          Invoke-WebRequest `
            -Uri $url `
            -Headers $headers `
            -OutFile $archive

          $protectorUrl = "https://api.github.com/repos/mindlessrest/ci/contents/Ryujin.zip?ref=$env:VOYAGER_REVISION"

          Invoke-WebRequest `
            -Uri $protectorUrl `
            -Headers $headers `
            -OutFile $protectorArchive

          if (
            !(Test-Path -LiteralPath $archive -PathType Leaf) -or
            (Get-Item -LiteralPath $archive).Length -eq 0
          ) {
            throw "Voyager archive download failed"
          }

          if (
            !(Test-Path -LiteralPath $protectorArchive -PathType Leaf) -or
            (Get-Item -LiteralPath $protectorArchive).Length -eq 0
          ) {
            throw "Mindless protector archive download failed"
          }

          & 7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract Voyager.7z (exit $LASTEXITCODE)"
          }

          Expand-Archive `
            -LiteralPath $protectorArchive `
            -DestinationPath $protectorDestination `
            -Force

          foreach ($file in @("Mindless.exe", "MindlessCore.dll")) {
            $path = Join-Path $protectorDestination $file

            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Ryujin.zip does not contain $file at its archive root"
            }
          }

      - name: Resolve and validate Voyager compiler
        shell: pwsh
        run: |
          $searchRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\voyager"

          $clang = Get-ChildItem `
            -LiteralPath $searchRoot `
            -Filter clang.exe `
            -File `
            -Recurse |
            Where-Object { $_.Directory.Name -eq "bin" } |
            Select-Object -First 1

          if (!$clang) {
            throw "Could not find bin\clang.exe below $searchRoot"
          }

          $root = $clang.Directory.Parent.FullName

          $cxx = @("clang-cl.exe", "clang++.exe") |
            ForEach-Object { Join-Path $root "bin\$_" } |
            Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            } |
            Select-Object -First 1

          $resourceDir = Join-Path $root "lib\clang\20"

          if (!$cxx) {
            throw "Missing bin\clang-cl.exe or bin\clang++.exe in $root"
          }

          if (!(Test-Path -LiteralPath $resourceDir -PathType Container)) {
            throw "Missing Clang 20 resource directory: $resourceDir"
          }

          "VOYAGER_PATH=$root" >> $env:GITHUB_ENV

          "Resolved Voyager root: $root"
          "Resolved C compiler: $($clang.FullName)"
          "Resolved C++ compiler: $cxx"

          & $clang.FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw "clang --version failed"
          }

          & $clang.FullName -print-resource-dir
          if ($LASTEXITCODE -ne 0) {
            throw "clang -print-resource-dir failed"
          }

      - name: Resolve and validate Mindless protector
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE ".ci\mindless-protector"
          $protector = Join-Path $destination "Mindless.exe"
          $core = Join-Path $destination "MindlessCore.dll"

          if (!(Test-Path -LiteralPath $protector -PathType Leaf)) {
            throw "Ryujin.zip does not contain Mindless.exe at its archive root"
          }

          if (!(Test-Path -LiteralPath $core -PathType Leaf)) {
            throw "Ryujin.zip does not contain MindlessCore.dll at its archive root"
          }

          "MINDLESS_PROTECTOR_ROOT=$destination" >> $env:GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve vcpkg revision
        id: vcpkg
        shell: pwsh
        run: |
          $rev = (git -C C:\vcpkg rev-parse HEAD).Trim()

          if (-not $rev) {
            throw "Could not resolve the vcpkg revision at C:\vcpkg"
          }

          "rev=$rev" >> $env:GITHUB_OUTPUT
          "archives=$env:LOCALAPPDATA\vcpkg\archives" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.archives }}
          key: vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('loader/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.vcpkg.outputs.rev }}-
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-

      - name: Build production client
        shell: pwsh
        run: python tools/build.py --prod --no-cache

      - name: Protect production loader
        shell: pwsh
        run: |
          $input = Join-Path $env:GITHUB_WORKSPACE "MindlessLoader.exe"
          $pdb = Join-Path $env:GITHUB_WORKSPACE "loader\out\build\windows-clang\Release\MindlessLoader.pdb"
          $output = Join-Path $env:GITHUB_WORKSPACE "MindlessLoader.protected.exe"
          $protector = Join-Path $env:MINDLESS_PROTECTOR_ROOT "Mindless.exe"

          foreach ($file in @($input, $pdb, $protector)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing loader protection input: $file"
            }
          }

          Push-Location $env:MINDLESS_PROTECTOR_ROOT

          try {
            & $protector `
              --input $input `
              --pdb $pdb `
              --output $output `
              --virtualize `
              --junk `
              --encrypt `
              --iat `
              --mangle-sections `
              --ai-refuse `
              --AntiDebug `
              --AntiDump `
              --MemoryProtection `
              --MutateMiniVM `
              --procs 'wWinMain,mindless::Application::start_auth,mindless::Application::start_download'

            $protectorExitCode = $LASTEXITCODE

            # Mindless intentionally returns 1 on successful protection.
            if ($protectorExitCode -ne 1) {
              throw "Mindless protector failed with exit code $protectorExitCode"
            }

            Write-Host "Mindless protector completed successfully (exit code 1)"
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "Mindless did not produce the protected loader"
          }

          if ((Get-Item -LiteralPath $output).Length -eq 0) {
            throw "Mindless produced an empty protected loader"
          }

          Write-Host "Protected loader size: $((Get-Item -LiteralPath $output).Length) bytes"

          Move-Item `
            -LiteralPath $output `
            -Destination $input `
            -Force

          Write-Host "Protected loader replaced original MindlessLoader.exe"

      - name: Verify release files
        shell: pwsh
        run: |
          $files = @(
            "MindlessLoader.exe",
            "client/native_build/dist/MindlessNative.dll"
          )

          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release file: $file"
            }

            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Empty release file: $file"
            }
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null

          Copy-Item `
            -LiteralPath "MindlessLoader.exe" `
            -Destination "release/MindlessLoader.exe"

          Copy-Item `
            -LiteralPath "client/native_build/dist/MindlessNative.dll" `
            -Destination "release/MindlessNative.dll"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindless-client-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || {
            echo "::error::DEPLOY_HOST is not configured"
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "::error::DEPLOY_USER is not configured"
            exit 1
          }

          test -n "$DEPLOY_SSH_KEY" || {
            echo "::error::DEPLOY_SSH_KEY is not configured"
            exit 1
          }

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: mindless-client-${{ github.sha }}
          path: release

      - name: Upload release to VPS staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "release/MindlessLoader.exe,release/MindlessNative.dll"
          target: "/tmp/mindless-${{ github.sha }}"
          strip_components: 1

      - name: Publish release to panel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu

            staging="/tmp/mindless-${{ github.sha }}"

            test -s "$staging/MindlessLoader.exe"
            test -s "$staging/MindlessNative.dll"

            cd /var/mindless/backend

            # Promotion owns the canonical loader and mindless-native records.
            # Refresh the managed checkout so legacy upload cleanup is always
            # applied before the replacement files are registered.
            git fetch origin main
            git reset --hard origin/main

            go run ./cmd/promote-release \
              -config config.yaml \
              -loader "$staging/MindlessLoader.exe" \
              -native "$staging/MindlessNative.dll"

            rm -f \
              "$staging/MindlessLoader.exe" \
              "$staging/MindlessNative.dll"

            rmdir "$staging"
