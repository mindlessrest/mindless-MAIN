<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Close this window and return to Minecraft!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #ffffff;
      --text:  #111111;
      --sub:   #999999;
      --green: #22c55e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:   #111111;
        --text: #f5f5f5;
        --sub:  #666666;
      }
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      animation: fade .35s ease .1s forwards;
    }

    @keyframes fade {
      to { opacity: 1; }
    }

    .wrap {
      max-width: 320px;
      width: 100%;
      text-align: center;
    }

    svg {
      display: block;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.4px;
      color: var(--text);
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--sub);
    }
  </style>
</head>
<body>
<div class="wrap">
  <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
    <polyline points="5,19 14,28 31,9" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>You're authenticated.</h1>
  <p>Close this window and return to Minecraft.</p>
</div>
</body>
</html>
